# Your patch layer for this dsh profile, applied after every bundle layer:
# a top-level YAML array of loader patch entries (id-targeted config
# overrides, disables, and insert lists; `!!js` expressions allowed).
#
# LLM 接入：中转站走 OpenAI 协议（openai-completions）。
# 注意：官方 deepseek-official 路由使用 DeepSeek Messages 协议，
# 本中转站的 Messages 流式响应缺少 message_stop 终止事件，不能复用该路由，
# 因此通过 llm-pi-ai 手工声明 deepseek1 路由，勿再 patch llm-deepseek 条目。
- id: llm-pi-ai
  name: "@deepseek-ai/dsh-llm-pi-ai"
  config:
    providers:
      deepseek1:
        displayName: DeepSeek V4.1 Flash (中转站)
        apiKeyEnv: DEEPSEEK1_API_KEY
        api: openai-completions
        baseURL: https://zzzxin.xin/v1
        retryPolicy:
          mode: normal
          maxRetries: 8
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - AUTH
          backoff:
            initialDelayMs: 5000
            maxDelayMs: 60000
            jitterRatio: 0.1
        timeoutMs: 180000
        models:
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
            contextWindow: 1000000
            maxTokens: 393216
          - id: deepseek-v4-1-flash
            name: deepseek-v4-1-flash
          - id: deepseek-v4-flash
            name: deepseek-v4-flash
      deepseekgaoji:
        displayName: deepseekgaoji
        apiKeyEnv: DEEPSEEKGAOJI_API_KEY
        api: openai-completions
        baseURL: https://zzzxin.xin/v1
        retryPolicy:
          mode: normal
          maxRetries: 8
          retryableCodes:
            - EMPTY_RESPONSE
            - RATE_LIMIT
            - SERVER
            - TIMEOUT
            - TRANSPORT
            - AUTH
          backoff:
            initialDelayMs: 5000
            maxDelayMs: 60000
            jitterRatio: 0.1
        timeoutMs: 180000
        models:
          - id: deepseek-v4-1-flash
            name: deepseek-v4-1-flash
          - id: deepseek-v4.1-flash
            name: deepseek-v4.1-flash
- id: ui-chat
  name: "@deepseek-ai/dsh-client-ui-chat"
  config:
    transcriptView: standard
    performanceUsage: detailed
- id: ui-settings
  name: "@deepseek-ai/dsh-client-ui-settings"
  config:
    enabled: true
- id: ui-settings-account
  name: "@deepseek-ai/dsh-client-ui-settings-account"
  config:
    version: 1
    step: done
    usage: detailed
    developerTools: true
    purpose: null
    process: standard
    completion: api-key
- id: agent-default-model
  name: "@deepseek-ai/dsh-agent-default-model"
  config:
    provider: deepseek1
    model: deepseek-v4-1-flash
